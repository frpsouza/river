<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>River Raid</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0f1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#111;color:#ccc;font-family:monospace}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  canvas{width:608px;height:736px;max-height:90vh;max-width:95vw;background:#000;object-fit:contain}
  small{opacity:.7}

  /* ---- celular / Android: canvas em cima, controles embaixo ---- */
  body.touch{justify-content:flex-start;gap:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);box-sizing:border-box;background:#0c0f1c}
  body.touch small{display:none}
  body.touch canvas{width:100vw;height:auto;max-width:100vw;max-height:calc(100vh - 150px);aspect-ratio:304/368}
  #pad{flex:1;width:100%;max-width:520px;max-height:320px;display:grid;gap:8px;padding:8px 10px 12px;box-sizing:border-box;
    grid-template-columns:1.15fr 1fr;grid-template-rows:minmax(120px,1fr);grid-template-areas:"dpad fire";align-items:center}
  #pad .btn{border:0;border-radius:14px;background:#26334f;color:#e8ecf5;font:bold 20px Arial,sans-serif;touch-action:none;
    box-shadow:0 4px 0 #161e30;-webkit-tap-highlight-color:transparent}
  #pad .btn.on{transform:translateY(3px);box-shadow:0 1px 0 #161e30;background:#33446a}
  #pad .fire{grid-area:fire;background:#e5484d;box-shadow:0 4px 0 #8f2a2e;font-size:22px}
  #pad .fire.on{background:#c23a3f;box-shadow:0 1px 0 #8f2a2e}
  /* direcional em cruz */
  #pad .dpad{grid-area:dpad;position:relative;height:min(100%,44vw,190px);aspect-ratio:1;justify-self:center;touch-action:none}
  #pad .arm,#pad .hub{position:absolute;background:#26334f;color:#9aa6c2;display:flex;align-items:center;justify-content:center;
    font:bold 18px Arial,sans-serif;box-shadow:0 4px 0 #161e30}
  #pad .arm.up{left:33%;top:0;width:34%;height:38%;border-radius:12px 12px 0 0}
  #pad .arm.down{left:33%;bottom:0;width:34%;height:38%;border-radius:0 0 12px 12px}
  #pad .arm.left{top:33%;left:0;width:38%;height:34%;border-radius:12px 0 0 12px}
  #pad .arm.right{top:33%;right:0;width:38%;height:34%;border-radius:0 12px 12px 0}
  #pad .hub{left:32%;top:32%;width:36%;height:36%;box-shadow:none}
  #pad .hub::after{content:"";width:40%;height:40%;border-radius:50%;background:#1d2840}
  #pad .arm.on{background:#3b63e0;color:#fff}
  /* cantos = diagonais: áreas visíveis entre os braços */
  #pad .corner{position:absolute;width:35%;height:35%;background:#1b2438;color:#56627e;display:flex;font:13px Arial,sans-serif;
    box-shadow:0 3px 0 #121a2a}
  #pad .corner.ul{left:0;top:0;border-radius:18px 4px 4px 4px;align-items:flex-start;justify-content:flex-start;padding:9% 0 0 9%;box-sizing:border-box}
  #pad .corner.ur{right:0;top:0;border-radius:4px 18px 4px 4px;align-items:flex-start;justify-content:flex-end;padding:9% 9% 0 0;box-sizing:border-box}
  #pad .corner.dl{left:0;bottom:0;border-radius:4px 4px 4px 18px;align-items:flex-end;justify-content:flex-start;padding:0 0 9% 9%;box-sizing:border-box}
  #pad .corner.dr{right:0;bottom:0;border-radius:4px 4px 18px 4px;align-items:flex-end;justify-content:flex-end;padding:0 9% 9% 0;box-sizing:border-box}
  #pad .corner.on{background:#2c4bb5;color:#fff}
  /* botão de fogo redondo */
  #pad .fire.round{justify-self:center;height:min(100%,34vw,150px);aspect-ratio:1;border-radius:50%;font-size:20px}
  #pad .u{grid-area:u}#pad .d{grid-area:d}
  #pad[data-screen="over"]{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,minmax(44px,1fr));
    grid-template-areas:"u pu minus plus" "d pd minus plus" "fire fire fire fire"}
  #pad[data-screen="over"] .btn{font-size:15px}
  #pad .pu{grid-area:pu}#pad .pd{grid-area:pd}#pad .minus{grid-area:minus}#pad .plus{grid-area:plus}
  #pad[data-screen="title"]{grid-template-columns:1fr 1fr;grid-template-rows:minmax(56px,1fr);grid-template-areas:"mode fire"}
  #pad .mode{grid-area:mode;font-size:16px}
</style>
</head>
<body>
<canvas id="c" width="304" height="368"></canvas>
<small>← → move · ↑ acelera · ↓ freia · ESPAÇO atira · ENTER inicia · fim de jogo: ↑↓ rolagem, PgUp/PgDn pontes, −/+ velocidade, ESPAÇO volta</small>
<script src="js/config.js" charset="utf-8"></script>
<script src="js/util.js" charset="utf-8"></script>
<script src="js/audio.js" charset="utf-8"></script>
<script src="js/terrain.js" charset="utf-8"></script>
<script src="js/objects.js" charset="utf-8"></script>
<script src="js/cliffs.js" charset="utf-8"></script>
<script src="js/powerups.js" charset="utf-8"></script>
<script src="js/state.js" charset="utf-8"></script>
<script src="js/effects.js" charset="utf-8"></script>
<script src="js/gameover.js" charset="utf-8"></script>
<script src="js/update.js" charset="utf-8"></script>
<script src="js/render/canvas.js" charset="utf-8"></script>
<script src="js/render/terrain.js" charset="utf-8"></script>
<script src="js/render/sprites.js" charset="utf-8"></script>
<script src="js/render/frame.js" charset="utf-8"></script>
<script src="js/main.js" charset="utf-8"></script>
<script src="js/touch.js" charset="utf-8"></script>
<script>
  // PWA: funciona offline e pode ser instalado no Android ("Adicionar à tela inicial").
  // Service workers só existem em http(s); abrindo pelo arquivo (file://) isto é ignorado.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
